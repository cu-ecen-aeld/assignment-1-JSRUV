name: assignment-test
on:
  push:
    tags-ignore:
      - '*'
    branches:
      - '*'
jobs:
  unit-test:
    container: cuaesd/aesd-autotest:24-unit-test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force
      - name: Debug submodule state
        run: |
          echo "Built commit: $(git rev-parse HEAD)"
          cat .gitmodules || echo "NO .gitmodules IN CI WORKSPACE"
          git submodule status
          ls -la assignment-autotest/

      - name: Make unit test executable
        run: chmod +x ./unit-test.sh || true

      - name: Run unit test
        run: ./unit-test.sh

  full-test:
    container: cuaesd/aesd-autotest:24-assignment1
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Make full test executable
        run: chmod +x ./full-test.sh || true

      - name: Run full test
        run: ./full-test.sh